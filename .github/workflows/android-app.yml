name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VoStudio.Engine/**'
      - 'VoStudio.App/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-app.yml'

permissions:
  contents: read

jobs:
  android-arm64-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform, build tools, and Qt-compatible NDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.1" "ndk;26.1.10909125"

      - name: Export Android NDK path
        run: echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Install Qt 6.8.3 for Android arm64
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: 'qtdeclarative qtmultimedia'
          cache: true

      - name: Configure VoStudio Android app
        run: >-
          "$QT_ROOT_DIR/bin/qt-cmake" -G Ninja -S . -B build-android
          -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"
          -DQT_ANDROID_ABIS=arm64-v8a
          -DQT_ANDROID_DEPLOYMENT_TYPE=Debug
          -DVOSTUDIO_BUILD_APP=ON
          -DVOSTUDIO_BUILD_TESTS=OFF
          -DVOSTUDIO_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: cmake --build build-android --target apk --config Release --parallel 2

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH="$(find build-android -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" dist/VoStudio-Android-arm64.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VoStudio-Android-APK-arm64
          path: dist/VoStudio-Android-arm64.apk
          if-no-files-found: error
          retention-days: 30

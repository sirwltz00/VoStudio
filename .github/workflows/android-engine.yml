name: Android Engine Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VoStudio.Engine/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android-engine.yml'

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
    
      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure Android engine
        run: >-
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DVOSTUDIO_BUILD_TESTS=OFF
          -DVOSTUDIO_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Android static library
        run: cmake --build build-android --config Release --parallel

      - name: Upload engine library
        uses: actions/upload-artifact@v4
        with:
          name: VoStudio-Engine-Android-arm64
          path: build-android/VoStudio.Engine/
          if-no-files-found: error
